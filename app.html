<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART RECRUIT — ATS Dashboard</title>
    <meta name="description" content="Smart Recruit ATS Dashboard — Manage candidates, track recruitment pipeline, schedule interviews and analyze hiring performance.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <div class="logo-icon"><i class="fas fa-brain"></i></div>
                <span>SMART RECRUIT</span>
            </div>
            <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-link active" data-page="dashboard">
                <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
            </a>
            <a href="#" class="sidebar-link" data-page="jobs">
                <i class="fas fa-briefcase"></i><span>Jobs</span>
            </a>
            <a href="#" class="sidebar-link" data-page="applications">
                <i class="fas fa-file-alt"></i><span>Applications</span>
            </a>
            <a href="#" class="sidebar-link" data-page="candidates">
                <i class="fas fa-users"></i><span>Candidates</span>
            </a>
            <a href="#" class="sidebar-link" data-page="pipeline">
                <i class="fas fa-stream"></i><span>Recruitment Pipeline</span>
            </a>
            <a href="#" class="sidebar-link" data-page="interviews">
                <i class="fas fa-calendar-alt"></i><span>Interviews</span>
            </a>
            <a href="#" class="sidebar-link" data-page="ai-screening">
                <i class="fas fa-robot"></i><span>AI Screening</span>
            </a>
            <a href="#" class="sidebar-link" data-page="analytics">
                <i class="fas fa-chart-pie"></i><span>Analytics</span>
            </a>
            <a href="#" class="sidebar-link" data-page="emails">
                <i class="fas fa-envelope"></i><span>Email Templates</span>
            </a>
            <a href="#" class="sidebar-link" data-page="settings">
                <i class="fas fa-cog"></i><span>Settings</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="sidebar-back">
                <i class="fas fa-arrow-left"></i><span>Back to Project Overview</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main" id="main">
        <!-- Top bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <h1 class="topbar-title" id="pageTitle">Dashboard</h1>
            </div>
            <div class="topbar-right">
                <div class="topbar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search candidates, jobs..." id="globalSearch">
                </div>
                <button class="topbar-icon-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="notif-dot"></span></button>
                <div class="topbar-user">
                    <div class="user-avatar">HR</div>
                    <div class="user-info">
                        <span class="user-name">HR Admin</span>
                        <span class="user-status"><span class="status-dot"></span> Online</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Content Container -->
        <div class="page-content" id="pageContent">
            <!-- Pages are rendered dynamically by JS -->
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
